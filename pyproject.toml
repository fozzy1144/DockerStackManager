[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-stack-manager"
version = "1.0.1"
description = "Desktop GUI for managing and updating Linux hosts and Docker Compose stacks over SSH"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan Stade" }]
keywords = ["docker", "compose", "ssh", "sysadmin", "gui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]

# Upper bounds are majors, not exact pins: a major release of any of these has
# broken us before, and a patch release should not need a commit here. Keep this
# list and requirements.txt in step — the packaging test asserts they agree.
dependencies = [
  "customtkinter>=5.2.0,<6",
  "paramiko>=3.4.0,<5",
  "keyring>=25.0.0,<26",
  # Optional at runtime — core.compose degrades to the host-side validator
  # without it — but wanted in any normal install, so it is a hard dependency
  # here rather than an extra nobody remembers to ask for.
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/fozzy1144/DockerStackManager"
Issues = "https://github.com/fozzy1144/DockerStackManager/issues"

[project.gui-scripts]
# gui-scripts, not scripts: on Windows this produces a launcher with no console
# window, which is what a Tk application wants.
docker-stack-manager = "main:main"

[tool.setuptools]
packages = ["core", "gui", "models"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
